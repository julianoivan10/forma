[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
ffi = false
fs_permissions = [{ access = "read-write", path = "../../deployments" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 131072

[profile.default.invariant]
runs = 256
depth = 200
fail_on_revert = false

# Deeper campaign for pre-deployment hardening: FOUNDRY_PROFILE=deep forge test
[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 1000
depth = 500

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
